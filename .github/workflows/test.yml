name: Test Ajisai

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # Every step here is blocking (R1-2). The staged rollout behind the
    # AJISAI_STRICT_QUALITY repository variable served its purpose and was
    # removed: an advisory-by-default gate produces green checkmarks that do
    # not certify anything.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust all-target tests
        working-directory: rust
        run: cargo test --all-targets --verbose

      - name: Rust branch coverage
        # --branch expands to `-Z coverage-options=branch`, which only a
        # nightly rustc accepts, so this step selects nightly explicitly while
        # the rest of the job stays on stable. Under the old advisory gate the
        # step had been failing silently on stable since it was written; the
        # blocking gate surfaced that on its first run.
        working-directory: rust
        run: |
          rustup toolchain install nightly --component llvm-tools-preview
          cargo +nightly llvm-cov --branch --workspace --no-report

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        # npm ci: reproducible install from the committed package-lock.json
        # (R1-1); fails rather than silently re-resolving on lock drift.
        run: npm ci

      - name: Install MCP adapter dependencies
        # The adapter is an independently lockfile-pinned package. Installing
        # it explicitly prevents a developer's nested node_modules directory
        # from hiding lock drift or a missing runtime dependency.
        run: npm ci --prefix tools/mcp-server

      - name: Install ripgrep
        # The semantic firewall greps the source with ripgrep. The runner does
        # not ship it, and without it the firewall would pass without scanning
        # (the script now hard-fails if rg is absent), so install it explicitly.
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Semantic firewall
        run: npm run check:semantic-firewall

      - name: Rust file-size budget (§14.1)
        # Enforces the SPECIFICATION §14.1 500-line budget mechanically: new or
        # substantially-rewritten Rust files must stay at or under 500 lines, and
        # the recorded over-budget baseline (docs/quality/file-size-baseline.json)
        # may not grow by >=10%. See scripts/check-file-size-budget.mjs.
        run: npm run check:file-size

      - name: Reading surfaces describe the present language (LANG.AUTHORITY.PRESENT)
        # The README, the Reference, and the Specification may name only Words the
        # vocabulary registry still holds. Derived from the registry rather than a
        # blocklist, so deleting a Word is enough to keep prose honest about it.
        run: npm run check:reading-surfaces

      - name: Verify generated specification surfaces are in sync
        # SPECIFICATION.html is generated from spec/ and must never be hand-edited;
        # the Word reference and Core hover contracts are generated from
        # spec/words.json. None of these were gated in CI, which is how a stale
        # generated surface and a broken word-schema checker both went unnoticed.
        run: |
          npm run specification:check
          npm run semantic-kernel:check
          npm run word-schema:check
          npm run word:reference:check
          npm run core-word-docs:check
          npm run word-registry:check

      - name: Generate conformance manifest
        run: npm run conformance:manifest

      - name: Verify committed word manifest is in sync
        # Drift guard: the committed docs/word-manifest.json must match what the
        # generator produces from the Rust sources. Checking (instead of silently
        # regenerating) is what catches a missing word like SUPERVISE.
        run: npm run word:manifest:check

      - name: Verify committed SKILL.md is in sync
        # SKILL.md is generated (never hand-written): the generator executes
        # every embedded snippet through the ajisai CLI, so this step both
        # catches a stale committed copy and proves the guide still matches
        # the implementation. The cargo target dir is already warm from the
        # test steps above, so the CLI build is incremental.
        run: |
          cargo build --bin ajisai --manifest-path rust/Cargo.toml
          npm run check:skill

      - name: Generate primitive test map
        run: npm run primitive:test-map

      - name: Check formalization coverage
        run: npm run check:formalization-coverage

      - name: Check Minimal Core closure
        run: npm run check:minimal-core

      - name: Package, crate and Tauri versions agree
        run: npm run check:version-sync

      - name: Runtime Core Word metadata is projected, not authored
        # BuiltinSpec is a joined view over generated docs and generated
        # contracts, never a second place to write language facts down. A
        # hand-authored table alongside it is what let two branches disagree
        # about Core Word metadata and produce a tree that would not compile.
        # This asserts the projection structurally, so a parallel table fails
        # here whatever it is named — see scripts/check-runtime-metadata-source.mjs.
        run: npm run check:runtime-metadata

      - name: TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: TypeScript MC/DC tests (Vitest)
        run: npm test

      - name: MCP protocol and real-backend integration
        # Blocking: builds the actual Rust CLI, drives the server through an
        # in-memory MCP transport, and validates compute/diagnostic/contract
        # results against the same published JSON Schema clients receive.
        run: npm run test:mcp

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust native check (Core build, no wasm deps)
        working-directory: rust
        run: cargo check

      # There is one execution path, so one build to test.
      - name: Run all Rust tests
        working-directory: rust
        run: cargo test --lib --verbose && cargo test --tests --verbose

      - name: Verify WASM build
        working-directory: rust
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --features wasm --target wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1

      - name: Detect stale committed wasm bundle (advisory)
        # Build the wasm bundle the same way the deploy workflow does and
        # compare against the committed copy. This is advisory only: even
        # if the committed bundle is stale, the deploy workflow rebuilds
        # before publishing, so production stays fresh. The warning exists
        # so reviewers know `npm run build:wasm` is needed for local dev to
        # match production.
        continue-on-error: true
        run: |
          set -e
          if ! command -v wasm-pack >/dev/null 2>&1; then
            bash ./scripts/install-wasm-pack.sh || {
              echo "::warning::wasm-pack install failed during stale-bundle check; skipping diff."
              exit 0
            }
          fi
          bash ./scripts/rebuild-wasm.sh > /tmp/rebuild-wasm.log 2>&1 || {
            cat /tmp/rebuild-wasm.log
            echo "::warning::wasm rebuild failed during stale-bundle check; skipping diff."
            exit 0
          }
          if ! git diff --quiet -- src/wasm/generated/; then
            echo "::warning::Committed src/wasm/generated/ bundle is stale relative to the Rust source."
            echo "::warning::Run \`npm run build:wasm\` and commit the result so local dev matches production."
            git --no-pager diff --stat -- src/wasm/generated/
          else
            echo "Committed wasm bundle matches a fresh build."
          fi

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        # npm ci: reproducible install from the committed package-lock.json
        # (R1-1); fails rather than silently re-resolving on lock drift.
        run: npm ci

      - name: Run TypeScript type check
        run: npm run check

      - name: Run Vitest MC/DC tests
        run: npm test

  wasm-boundary-tests:
    name: WASM Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1

      - name: Install wasm-pack
        run: bash ./scripts/install-wasm-pack.sh

      # Drives the real wasm-bindgen boundary (AjisaiInterpreter -> collect_stack)
      # in Node. Lives in a standalone crate so the main package's proptest
      # dev-dep (which does not build for wasm32) never enters the graph.
      - name: Run WASM boundary tests
        working-directory: rust/wasm-tests
        run: wasm-pack test --node
