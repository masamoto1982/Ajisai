<!DOCTYPE html>
<!-- Generated by scripts/generate-specification.mjs. Do not edit directly. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ajisai Language Specification - the single canonical design authority for the Ajisai language">
    <title>Ajisai Language Specification</title>

    <!--
      Authoring rule (docs/dev/ajisai-authoring-style.md): the specification and
      the README are authored directly in HTML, not Markdown. The point is not
      decoration - HTML makes tables and embedded diagram sources (e.g.
      PlantUML) first-class authoring tools. Keep this page plain: no ornament
      beyond what the Reference (public/docs/) already uses.
      - Every Ajisai token is wrapped in <code> (gray background = Ajisai channel).
      - Mathematics is set off in its own channel, never in the gray code channel.
        It is typeset as LaTeX via the self-hosted KaTeX copy in vendor/katex/
        (public/vendor/katex/ in the repository), with \( ... \) inline and
        \[ ... \] display delimiters. These delimiters collide with no Ajisai
        surface form and are the canonical math-channel markers on the HTML
        surfaces. Without JavaScript the raw LaTeX source remains visible,
        which is the intended machine-readable fallback.
    -->
    <style>
/* Plain document styling for SPECIFICATION.html.
           Modeled on the Reference (public/docs/index.html): unadorned,
           bordered tables, gray <code> background reserved for Ajisai tokens. */
        :root {
            --font-stack-primary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            --font-stack-mono: "SF Mono", Consolas, "Liberation Mono", Monaco, monospace;
            --color-primary: #6b5b95;
            --color-text: #202122;
            --color-text-light: #54595d;
            --border-main: solid 1px #a2a9b1;
            --color-light: #f8f9fa;
            --color-medium: #eaecf0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-stack-primary);
            background: #fff;
            color: var(--color-text);
            line-height: 1.7;
        }

        main {
            max-width: 60rem;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        a { color: var(--color-primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin: 0.5rem 0 1rem;
            padding-bottom: 0.3rem;
            border-bottom: var(--border-main);
        }

        h2 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 2.5rem 0 0.75rem;
            padding-bottom: 0.3rem;
            border-bottom: var(--border-main);
        }

        h3 { font-size: 1.1rem; font-weight: 600; margin: 1.75rem 0 0.5rem; }
        h4 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
        h5 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }

        p { margin: 0.5rem 0 0.75rem; }

        code {
            font-family: var(--font-stack-mono);
            font-size: 0.9em;
            background: var(--color-medium);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        pre {
            background: var(--color-light);
            border: var(--border-main);
            padding: 0.75rem 1rem;
            overflow-x: auto;
            line-height: 1.5;
        }

        pre code { background: none; padding: 0; font-size: 0.85rem; }

        blockquote {
            margin: 1rem 0;
            padding: 0.25rem 1rem;
            border-left: 3px solid #a2a9b1;
            background: var(--color-light);
            color: var(--color-text-light);
        }

        ul, ol { margin: 0.5rem 0 0.75rem; padding-left: 1.5rem; }
        li { margin: 0.2rem 0; }

        .ref-table-wrap { overflow-x: auto; margin: 0.75rem 0 1.25rem; }

        .ref-table { width: 100%; border-collapse: collapse; }

        .ref-table th,
        .ref-table td {
            border: var(--border-main);
            padding: 0.5rem 0.75rem;
            text-align: left;
            vertical-align: top;
        }

        .ref-table th {
            background: var(--color-light);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--color-text-light);
        }

        .ref-table td.notes { font-size: 0.85rem; color: var(--color-text-light); }

        .toc {
            background: var(--color-light);
            border: var(--border-main);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
        }

        .toc h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-light);
            margin: 0 0 0.5rem;
            border: none;
            padding: 0;
        }

        .toc ul { margin: 0; padding-left: 1.25rem; }

        .doc-nav { font-size: 0.875rem; color: var(--color-text-light); margin-top: 0; }

        /* Homemade tech-stack badges (README): uniform, no external services. */
        .badges { margin: 0.75rem 0; }

        .badge {
            display: inline-block;
            border: var(--border-main);
            border-radius: 3px;
            background: var(--color-light);
            color: var(--color-text-light);
            font-size: 0.8rem;
            padding: 0.1rem 0.6rem;
            margin-right: 0.4rem;
        }

        .logo { width: 120px; height: 120px; object-fit: contain; }

        .math-display { margin: 0.75rem 0 1rem; overflow-x: auto; }
    </style>

    <!-- KaTeX (self-hosted, see docs/dev/ajisai-authoring-style.md Section 4).
         Delimiters: \( ... \) inline, \[ ... \] display — the canonical
         math-channel markers on the HTML surfaces. code/pre are never scanned,
         so the gray Ajisai channel is structurally excluded from math
         rendering. -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body, {
                delimiters: [
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                throwOnError: false
            });"></script>
</head>
<body>
<main>{{SPECIFICATION_CONTENT}}</main>
</body>
</html>
